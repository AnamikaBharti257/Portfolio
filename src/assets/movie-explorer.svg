<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="poster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="poster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <linearGradient id="poster3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="poster4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Chrome Header -->
  <rect width="1200" height="48" rx="16" fill="#1e293b"/>
  <rect y="32" width="1200" height="16" fill="#1e293b"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#334155" stroke-width="1"/>
  
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>

  <rect x="360" y="10" width="480" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">movie-explorer.anamikabharti.dev</text>

  <!-- Navbar inside app -->
  <rect x="0" y="49" width="1200" height="64" fill="#0f172a" fill-opacity="0.8"/>
  <line x1="0" y1="113" x2="1200" y2="113" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo -->
  <text x="50" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Cine<tspan fill="#38bdf8">Scope</tspan></text>
  <text x="160" y="86" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Powered by OMDb API</text>

  <!-- Search Input -->
  <rect x="420" y="61" width="420" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="445" cy="81" r="6" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
  <line x1="449" y1="85" x2="455" y2="91" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="468" y="86" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14">Interstellar</text>
  <rect x="760" y="67" width="70" height="28" rx="6" fill="#0284c7"/>
  <text x="795" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Search</text>

  <!-- Filter chips -->
  <rect x="940" y="67" width="60" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="970" y="85" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">All</text>
  <rect x="1010" y="67" width="70" height="28" rx="14" fill="#1e293b"/>
  <text x="1045" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Movies</text>
  <rect x="1090" y="67" width="60" height="28" rx="14" fill="#1e293b"/>
  <text x="1120" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Series</text>

  <!-- Featured Banner / Details View -->
  <rect x="50" y="140" width="1100" height="200" rx="14" fill="url(#poster1)" stroke="#334155" stroke-width="1"/>
  <rect x="70" y="160" width="110" height="160" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <circle cx="125" cy="225" r="24" fill="#4f46e5" fill-opacity="0.3"/>
  <polygon points="120,215 135,225 120,235" fill="#a5b4fc"/>
  <text x="125" y="295" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">POSTER PREVIEW</text>

  <text x="210" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Interstellar (2014)</text>
  
  <rect x="210" y="200" width="70" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="245" y="215" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 8.7 / 10</text>

  <rect x="290" y="200" width="70" height="22" rx="4" fill="#334155"/>
  <text x="325" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">169 min</text>

  <rect x="370" y="200" width="110" height="22" rx="4" fill="#334155"/>
  <text x="425" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Sci-Fi, Adventure</text>

  <text x="210" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot, Joseph Cooper,</text>
  <text x="210" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">is tasked to pilot a spacecraft, along with a team of researchers, to find a new planet for humans.</text>

  <text x="210" y="305" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#64748b">Director:</tspan> Christopher Nolan  •  <tspan fill="#64748b">Cast:</tspan> Matthew McConaughey, Anne Hathaway, Jessica Chastain</text>

  <!-- Grid of results -->
  <text x="50" y="375" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Search Results for "Space & Sci-Fi"</text>

  <!-- Movie Card 1 -->
  <g transform="translate(50, 395)">
    <rect width="250" height="315" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="12" width="226" height="190" rx="8" fill="url(#poster1)"/>
    <text x="125" y="115" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Interstellar</text>
    <rect x="175" y="22" width="55" height="20" rx="4" fill="#000000" fill-opacity="0.7"/>
    <text x="202" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 8.7</text>
    <text x="16" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Interstellar</text>
    <text x="16" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2014 • Christopher Nolan</text>
    <rect x="16" y="268" width="218" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="125" y="289" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Full Details</text>
  </g>

  <!-- Movie Card 2 -->
  <g transform="translate(330, 395)">
    <rect width="250" height="315" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="12" width="226" height="190" rx="8" fill="url(#poster2)"/>
    <text x="125" y="115" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Inception</text>
    <rect x="175" y="22" width="55" height="20" rx="4" fill="#000000" fill-opacity="0.7"/>
    <text x="202" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 8.8</text>
    <text x="16" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Inception</text>
    <text x="16" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2010 • Sci-Fi Thriller</text>
    <rect x="16" y="268" width="218" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="289" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Full Details</text>
  </g>

  <!-- Movie Card 3 -->
  <g transform="translate(610, 395)">
    <rect width="250" height="315" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="12" width="226" height="190" rx="8" fill="url(#poster3)"/>
    <text x="125" y="115" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">The Martian</text>
    <rect x="175" y="22" width="55" height="20" rx="4" fill="#000000" fill-opacity="0.7"/>
    <text x="202" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 8.0</text>
    <text x="16" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">The Martian</text>
    <text x="16" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2015 • Ridley Scott</text>
    <rect x="16" y="268" width="218" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="289" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Full Details</text>
  </g>

  <!-- Movie Card 4 -->
  <g transform="translate(890, 395)">
    <rect width="250" height="315" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="12" width="226" height="190" rx="8" fill="url(#poster4)"/>
    <text x="125" y="115" fill="#fdba74" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Oppenheimer</text>
    <rect x="175" y="22" width="55" height="20" rx="4" fill="#000000" fill-opacity="0.7"/>
    <text x="202" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 8.9</text>
    <text x="16" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Oppenheimer</text>
    <text x="16" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2023 • Biography, Drama</text>
    <rect x="16" y="268" width="218" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="289" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Full Details</text>
  </g>
</svg>

